  #   entrypoint: >
  #     /bin/sh -c "
  #     echo 'Waiting for API Key...';
  #     while [ ! -f /app/shared/.env ] || ! grep -q 'API_KEY' /app/shared/.env; do
  #       sleep 2;
  #     done;
  #     echo 'API Key found! Copying .env file';
  #     cp /app/shared/.env /.env;
  #     npm run start

  ecomps-backend:
    container_name: ecomps_backend
    build: "./ecomps_backend/."
    restart: always
    depends_on:
      ecomps-db:
        condition: service_healthy
    environment:
      tables_path: "sql_statements/tables.sql"
      JWT-Secret: "TestAsdEsAowiASdlASooPp" # NOTE: Change this if you run this in production
      Database-Conn: "ecomps_backend:YOUR-PW-HERE@tcp(ecomps-db:3306)/Ecomps?parseTime=true"
      env_path: "/app/shared/.env"
    ports:
      - "8080:8080"
    volumes:
      - logs:/app/logs
      - shared-env:/app/shared
      - product-pictures:/app/product-pictures
    links:
      - "ecomps-db"

  ecomps-db:
    container_name: ecomps_db
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "YOUR-SUPER-SECRET-PW-HERE" # CHANGE THIS IF PRODUCTION!!!
      MYSQL_DATABASE: "Ecomps" # DO NOT change this!
      MYSQL_USER: "ecomps_backend"
      MYSQL_PASSWORD: "YOUR-PW-HERE" # Change this if production! Note that you have to change the connection string
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"

# Volumes for ecomps backend container
volumes:
  shared-env:
  product-pictures:
  logs:
