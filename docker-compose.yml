services:
  ecomps-frontend-dev:
    container_name: ecomps_dev_frontend
    image: nginx:alpine
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./ecomps_dev_frontend:/usr/share/nginx/html/:ro
      - ./ecomps_dev_frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ecomps-backend

  # ecomps-frontend:
  #   env_file:
