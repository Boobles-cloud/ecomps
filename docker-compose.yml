services:
  boobles-frontend-dev:
    container_name: boobles_dev_frontend
    image: nginx:alpine
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./boobles_dev_frontend:/usr/share/nginx/html/:ro
      - ./boobles_dev_frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - boobles-backend

  # boobles-frontend:
  #   env_file:
